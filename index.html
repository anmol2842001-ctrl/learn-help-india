let currentSubject = "";

/* =========================================================

========================================================= */

function openStudy(subject){

    currentSubject = subject;

    const theoryArea =
        document.getElementById("theoryArea");

    if(!theoryArea){
        alert("Study Area नहीं मिला।");
        return;
    }

    const data = theory[subject];

    if(!data){
        alert("Subject data नहीं मिला।");
        return;
    }

    theoryArea.innerHTML = `
    <div class="feature">

        <h2 style="color:#1565c0;text-align:center">
        ${data.title}
        </h2>

        ${data.content}

        <div style="text-align:center;margin-top:20px">

            <button type="button"
            onclick="startQuiz('${subject}')">

            📝 ${data.title} के Questions शुरू करें

            </button>

        </div>

    </div>`;

    theoryArea.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}


/* =========================================================
   START QUIZ
========================================================= */

function startQuiz(subject){

    currentSubject = subject;

    currentQuestions = questions[subject] || [];

    if(currentQuestions.length === 0){
        alert("Questions उपलब्ध नहीं हैं।");
        return;
    }

    currentQuestionIndex = 0;
    score = 0;
    answered = false;

    const start =
        document.getElementById("quizStart");

    const quizBox =
        document.getElementById("quizBox");

    const result =
        document.getElementById("result");

    if(start)
        start.style.display = "none";

    if(result)
        result.style.display = "none";

    if(quizBox)
        quizBox.style.display = "block";

    showQuestion();

    const quiz =
        document.getElementById("quiz");

    if(quiz){

        setTimeout(function(){

            quiz.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

        },100);

    }
}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion(){

    if(!currentQuestions.length)
        return;

    const q =
        currentQuestions[currentQuestionIndex];

    if(!q)
        return;

    answered = false;

    const progress =
        document.getElementById("progress");

    const question =
        document.getElementById("question");

    const options =
        document.getElementById("options");

    const feedback =
        document.getElementById("feedback");

    const explanation =
        document.getElementById("explanation");

    const nextBtn =
        document.getElementById("nextBtn");


    if(progress){

        progress.textContent =
        `Question ${currentQuestionIndex+1} / ${currentQuestions.length}`;

    }


    if(question){

        const title =
            question.querySelector("h3");

        if(title){

            title.textContent =
            `${currentQuestionIndex+1}. ${q[0]}`;

        }

    }


    if(options){

        options.innerHTML = "";

        q[1].forEach(function(option,index){

            const btn =
                document.createElement("button");

            btn.type = "button";

            btn.className = "option";

            btn.textContent =
                `${String.fromCharCode(65+index)}. ${option}`;

            btn.addEventListener("click",function(){

                checkAnswer(index,btn);

            });

            options.appendChild(btn);

        });

    }


    if(feedback){

        feedback.textContent = "";

    }


    if(explanation){

        explanation.style.display = "none";

        explanation.innerHTML = "";

    }


    if(nextBtn){

        nextBtn.style.display = "none";

    }

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(selected,clickedButton){

    if(answered)
        return;

    answered = true;

    const q =
        currentQuestions[currentQuestionIndex];

    const correct =
        q[2];

    const buttons =
        document.querySelectorAll("#options .option");

    buttons.forEach(function(btn,index){

        btn.disabled = true;

        if(index === correct){

            btn.classList.add("correct");

        }

    });


    const feedback =
        document.getElementById("feedback");


    if(selected === correct){

        score++;

        clickedButton.classList.add("correct");

        if(feedback){

            feedback.textContent =
            "✅ सही उत्तर!";

            feedback.style.color =
            "#2e7d32";

        }

    }else{

        clickedButton.classList.add("wrong");

        if(feedback){

            feedback.textContent =
            "❌ गलत उत्तर!";

            feedback.style.color =
            "#c62828";

        }

    }


    const explanation =
        document.getElementById("explanation");

    if(explanation){

        explanation.innerHTML =
        `<b>💡 Explanation:</b><br>${q[3]}`;

        explanation.style.display =
        "block";

    }


    const nextBtn =
        document.getElementById("nextBtn");

    if(nextBtn){

        nextBtn.style.display =
        "block";

        nextBtn.textContent =
        currentQuestionIndex === currentQuestions.length-1
        ? "🏆 Result देखें"
        : "Next Question ➡️";

    }

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    currentQuestionIndex++;

    if(currentQuestionIndex >= currentQuestions.length){

        showResult();

        return;

    }

    showQuestion();

}


/* =========================================================
   RESULT
========================================================= */

function showResult(){

    const quizBox =
        document.getElementById("quizBox");

    const result =
        document.getElementById("result");

    const scoreElement =
        document.getElementById("score");

    const message =
        document.getElementById("message");


    if(quizBox)
        quizBox.style.display = "none";

    if(result)
        result.style.display = "block";


    const total =
        currentQuestions.length;

    const percentageScore =
        Math.round((score/total)*100);


    if(scoreElement){

        scoreElement.textContent =
        `${score} / ${total}`;

    }


    if(message){

        if(percentageScore >= 80){

            message.textContent =
            `🎉 शानदार! आपका score ${percentageScore}% है।`;

        }else if(percentageScore >= 60){

            message.textContent =
            `👍 अच्छा प्रयास! आपका score ${percentageScore}% है।`;

        }else{

            message.textContent =
            `📚 Theory दोबारा पढ़कर Practice करें। आपका score ${percentageScore}% है।`;

        }

    }

}

/* =========================================================
   BASIC CALCULATOR
========================================================= */

function calculate(){

    const input =
        document.getElementById("calcInput");

    const result =
        document.getElementById("calcResult");

    if(!input || !result)
        return;

    const value =
        input.value.trim();

    if(!value){

        result.textContent =
        "कृपया calculation डालें।";

        return;

    }

    try{

        if(!/^[0-9+\-*/().%\s]+$/.test(value))
            throw new Error();

        const answer =
            Function('"use strict";return ('+value+')')();

        result.textContent =
        "Result = " + answer;

    }catch(e){

        result.textContent =
        "Invalid calculation";

    }

}

/* =========================================================
   DECIMAL TO KATHA
========================================================= */

function decimalToKatha(){

    const decimal =
        parseFloat(
            document.getElementById("decimalInput").value
        );

    const result =
        document.getElementById("decimalResult");

    if(!isFinite(decimal) || decimal < 0){

        result.textContent =
        "कृपया सही Decimal डालें.";

        return;

    }

    const sqft =
        decimal*435.6;

    const katha =
        sqft/1361;

    const wholeKatha =
        Math.floor(katha);

    const remaining =
        katha-wholeKatha;

    const dhur =
        remaining*20;

    result.innerHTML =
    `${decimal} Decimal ≈
    ${wholeKatha} Katha
    ${dhur.toFixed(2)} Dhur
    <br>
    Area ≈ ${sqft.toFixed(2)} sq.ft.`;

}
